<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sunghyun Park</title>
  <script>
    // GitHub Pages SPA redirect trick
    // Encode the path as a query param so index.html can restore it
    var path = window.location.pathname.slice(1);
    if (path) {
      window.location.replace(
        window.location.origin + '/?p=' + encodeURIComponent(path).replace(/%20/g, '+') +
        (window.location.search ? '&' + window.location.search.slice(1) : '') +
        window.location.hash
      );
    }
  </script>
</head>
<body></body>
</html>
